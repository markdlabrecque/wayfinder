# Wayfinder schema preset: Drupal `search_api_solr` module.
#
# Expresses the field-naming convention the `search_api_solr` module (pinned
# 4.4.0) uses to talk to Solr, as Wayfinder `[[fields]]` + `[[dynamic_fields]]`
# rules, so any Drupal site indexes into Wayfinder with zero per-site schema
# authoring. Derived from the captured ground-truth configset at
# `solr-ref/search-api/configset/schema.xml` (issue #55), not from guesswork
# about the module's conventions.
#
# `default_field` below is inert for this preset: search_api_solr always sends
# an explicit `qf`/`df` per query in real traffic, so no particular value is
# load-bearing here. It just has to be a valid field name.
#
# One genuine divergence from the captured Solr schema: Wayfinder has no
# boolean field type. Solr's `boolean`/`booleans` (`bs_*`/`bm_*`) are mapped to
# Wayfinder's `string` type here instead. Captured Drupal traffic already sends
# boolean values as JSON strings (`"true"`/`"false"`) on input, so that side
# matches; the divergence is one-directional, on output: Wayfinder returns
# `"true"`/`"false"` as a JSON string where Solr returns a native JSON boolean.
#
# A second, distinct divergence: `sort_*` maps to Wayfinder's `string` type as
# a stand-in for Solr's `collated_en`/`collated_und` field type, since
# Wayfinder has no collation type.
#
# This preset covers the prefixes real captured Drupal traffic actually uses
# (verified against `solr-ref/search-api/trace/*.json`), not the full
# configset's exhaustive prefix list -- `random_*`, `access_*`,
# `xs_`/`xm_` binary, `hs_`/`hts_` hierarchy, etc. are out of scope. Don't
# mistake this for a complete `schema.xml` transliteration.
#
# issue #331 added the spatial `location` field type and these four dynamic
# rules (`locs_*`/`locm_*`/`geos_*`/`geom_*`) from the configset; a stored
# dynamic point round-trips as its `lat,lon` string, but `geodist()` on a
# dynamic sfield is not yet supported (the two-column encoding needs the field
# name at build time) -- see `WayfinderSchema::location_fields`.
#
# issue #300 added the search_api_solr non-default data types that round-trip
# on these existing Wayfinder types: `zs_*`/`zm_*` (solr_string_storage) and
# `zdvs_*`/`zdvm_*` (solr_string_docvalues) -> string; `tus_*`/`tum_*`
# (solr_text_unstemmed), `tos_*`/`tom_*` (solr_text_omit_norms),
# `tws_*`/`twm_*` (solr_text_wstoken) -> text_general; plus the fixed sink
# field `twm_suggest` (solr_text_suggester). The indexability divergence on
# zs_/zm_/zdvs_/zdvm_ is the same shape as the boolean one below: Wayfinder
# has no unindexed field, so a Solr storage/docValues-only string is also
# indexed (and therefore queryable) here. The text variants all collapse onto
# text_general, so their Solr analyzer-chain distinctions (unstemmed vs
# omit-norms vs whitespace-tokenized) are not preserved -- a documented
# scoring-quality divergence, not a data-integrity one.

[core]
name = "content"
unique_key = "id"
default_field = "id"

# --- static fields: exact names the module always sends ---------------------

[[fields]]
name = "id"
type = "string"
stored = true
fast = true
required = true

[[fields]]
name = "index_id"
type = "string"
stored = true
fast = true

[[fields]]
name = "hash"
type = "string"
stored = true
fast = true

[[fields]]
name = "site"
type = "string"
stored = true
fast = true

[[fields]]
name = "timestamp"
type = "date"
stored = true
fast = true

[[fields]]
name = "boost_document"
type = "float"
stored = true
fast = true

# solr_text_suggester sink field (issue #300): every field of this type
# indexes into this one field, which the SuggestComponent (#291) reads. Solr
# declares it as text_ws (whitespace); Wayfinder text_general is the closest
# available type. This is a static field, so it wins over the twm_* dynamic
# rule above for the exact name "twm_suggest".
[[fields]]
name = "twm_suggest"
type = "text_general"
multi_valued = true
stored = true

# --- dynamic fields: one rule per search_api_solr prefix convention --------

# single-valued, not analyzed
[[dynamic_fields]]
pattern = "ss_*"
type = "string"
stored = true
fast = true

# multi-valued, not analyzed
[[dynamic_fields]]
pattern = "sm_*"
type = "string"
multi_valued = true
stored = true
fast = true

# single-valued full text, general tokenizer
[[dynamic_fields]]
pattern = "ts_*"
type = "text_general"
stored = true

# multi-valued full text, general tokenizer
[[dynamic_fields]]
pattern = "tm_*"
type = "text_general"
multi_valued = true
stored = true

# single-valued full text, English stemmed (search_api_solr encodes the
# language-code separator ";" as "X3b" in the field name)
[[dynamic_fields]]
pattern = "ts_X3b_en_*"
type = "text_en"
stored = true

# multi-valued full text, English stemmed
[[dynamic_fields]]
pattern = "tm_X3b_en_*"
type = "text_en"
multi_valued = true
stored = true

# single-valued int
[[dynamic_fields]]
pattern = "is_*"
type = "int"
stored = true
fast = true

# multi-valued int
[[dynamic_fields]]
pattern = "im_*"
type = "int"
multi_valued = true
stored = true
fast = true

# single-valued long
[[dynamic_fields]]
pattern = "its_*"
type = "long"
stored = true
fast = true

# multi-valued long
[[dynamic_fields]]
pattern = "itm_*"
type = "long"
multi_valued = true
stored = true
fast = true

# single-valued float
[[dynamic_fields]]
pattern = "fs_*"
type = "float"
stored = true
fast = true

# multi-valued float
[[dynamic_fields]]
pattern = "fm_*"
type = "float"
multi_valued = true
stored = true
fast = true

# single-valued decimal (search_api_wayfinder's FieldMapper "ft" prefix for
# Search API's "decimal" type -- distinct from search_api_solr's own fs_/fm_
# float convention above, but the same underlying Wayfinder "float" type)
[[dynamic_fields]]
pattern = "fts_*"
type = "float"
stored = true
fast = true

# multi-valued decimal
[[dynamic_fields]]
pattern = "ftm_*"
type = "float"
multi_valued = true
stored = true
fast = true

# single-valued double
[[dynamic_fields]]
pattern = "ps_*"
type = "double"
stored = true
fast = true

# multi-valued double
[[dynamic_fields]]
pattern = "pm_*"
type = "double"
multi_valued = true
stored = true
fast = true

# single-valued date
[[dynamic_fields]]
pattern = "ds_*"
type = "date"
stored = true
fast = true

# multi-valued date
[[dynamic_fields]]
pattern = "dm_*"
type = "date"
multi_valued = true
stored = true
fast = true

# single-valued boolean -> string (Wayfinder has no boolean type; see header)
[[dynamic_fields]]
pattern = "bs_*"
type = "string"
stored = true
fast = true

# multi-valued boolean -> string
[[dynamic_fields]]
pattern = "bm_*"
type = "string"
multi_valued = true
stored = true
fast = true

# --- issue #300: search_api_solr non-default data types ---------------------
# Prefixes from search_api_solr 4.4.0's search_api_data_type_info_alter hook
# (src/Hook/SearchApiSolrHooks.php) and the dynamicField declarations in
# solr-ref/search-api/configset/schema.xml.

# solr_string_storage: single/multi string, stored only (Solr indexed=false).
# Wayfinder has no unindexed field, so these are indexed here too -- the one
# directional divergence is that a storage-only field becomes queryable. No
# fast (Solr's zs_/zm_ carry no docValues).
[[dynamic_fields]]
pattern = "zs_*"
type = "string"
stored = true

[[dynamic_fields]]
pattern = "zm_*"
type = "string"
multi_valued = true
stored = true

# solr_string_docvalues: single/multi string, docValues-only (Solr
# indexed=false, stored=true, docValues=true). fast=true mirrors the docValues
# columnar store; same indexed-when-Solr-isn't divergence as zs_/zm_.
[[dynamic_fields]]
pattern = "zdvs_*"
type = "string"
stored = true
fast = true

[[dynamic_fields]]
pattern = "zdvm_*"
type = "string"
multi_valued = true
stored = true
fast = true

# solr_text_unstemmed: Solr text_unstemmed_en/text_und; Wayfinder text_general
# is unstemmed too, so this is the faithful mapping.
[[dynamic_fields]]
pattern = "tus_*"
type = "text_general"
stored = true

[[dynamic_fields]]
pattern = "tum_*"
type = "text_general"
multi_valued = true
stored = true

# solr_text_omit_norms: Solr text_en/text_und with omitNorms=true. Wayfinder
# keeps length norms on (no per-field omitNorms toggle) -- documented scoring
# divergence, the field still round-trips and is queryable.
[[dynamic_fields]]
pattern = "tos_*"
type = "text_general"
stored = true

[[dynamic_fields]]
pattern = "tom_*"
type = "text_general"
multi_valued = true
stored = true

# solr_text_wstoken: Solr text_ws (whitespace tokenizer, omitNorms). Wayfinder
# text_general uses a simple tokenizer and keeps norms -- documented
# tokenizer+norms divergence.
[[dynamic_fields]]
pattern = "tws_*"
type = "text_general"
stored = true

[[dynamic_fields]]
pattern = "twm_*"
type = "text_general"
multi_valued = true
stored = true

# spellcheck suggestion text, general tokenizer, always multi-valued
[[dynamic_fields]]
pattern = "spellcheck_*"
type = "text_general"
multi_valued = true
stored = true

# dedicated single-valued sort field, not analyzed
[[dynamic_fields]]
pattern = "sort_*"
type = "string"
fast = true

# --- #331 spatial: `location` (LatLonPointSpatialField) dynamic rules ------
# From `solr-ref/search-api/configset/schema.xml:229-237`. A stored point
# round-trips as its `lat,lon` string; `geodist()` reads a declared `location`
# field's two synthetic columns, which a dynamic name cannot have, so distance
# on a dynamic sfield is a documented ceiling of this tracer.
[[dynamic_fields]]
pattern = "locs_*"
type = "location"
stored = true

[[dynamic_fields]]
pattern = "locm_*"
type = "location"
stored = true
multi_valued = true

# GeoHash aliases are deprecated (LatLonPointSpatialField supersedes them) but
# the configset keeps the dedicated names for backward compatibility.
[[dynamic_fields]]
pattern = "geos_*"
type = "location"
stored = true

[[dynamic_fields]]
pattern = "geom_*"
type = "location"
stored = true
multi_valued = true
# --- issue #334: spatial RPT (heatmap) dynamic fields -----------------------
# `rpts_*`/`rptm_*` are search_api_solr's SpatialRecursivePrefixTreeFieldType
# fields (configset schema.xml:240-241), the ones `facet.heatmap` runs over.
# They resolve to `location_rpt` -> `ValueKind::Location`. A dynamic rule has
# no name at build time, so a dynamic `rpts_*` field is stored as its `lat,lon`
# string in the catch-all JSON (matching Solr's returned form) and has no
# synthetic `__lat`/`__lon` fast columns. `facet.heatmap` needs those columns,
# so it requires a *declared static* `location_rpt` field (a documented v1
# ceiling on the dynamic form, consistent with `geodist()` on a dynamic
# `location` field, #331). `stored = true` mirrors Solr; no `fast` -- there is
# no docValues column for a dynamic point.
[[dynamic_fields]]
pattern = "rpts_*"
type = "location_rpt"
stored = true

[[dynamic_fields]]
pattern = "rptm_*"
type = "location_rpt"
multi_valued = true
stored = true
