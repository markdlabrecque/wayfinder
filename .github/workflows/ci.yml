name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo fmt --check --manifest-path bench/Cargo.toml
      - run: cargo clippy --manifest-path bench/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path bench/Cargo.toml

  # search_api_wayfinder integration harness (issue #80, part of #57). Manual
  # only -- gated behind WAYFINDER_INTEGRATION=1 the same way
  # tests/differential.rs's live-Solr mode is gated behind
  # WAYFINDER_DIFF_SOLR=1, and NOT added to the `on:` triggers above, so it
  # never runs on push/pull_request. Trigger by hand from the Actions tab
  # (workflow_dispatch) once this harness is green locally; M5 (#79) owns
  # deciding whether it graduates to an automatic job.
  search-api-wayfinder-integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run search_api_wayfinder integration harness
        env:
          WAYFINDER_INTEGRATION: "1"
        run: bash drupal/search_api_wayfinder/tests/integration/run.sh
