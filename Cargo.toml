[package]
name = "wayfinder"
version = "0.1.0"
edition = "2024"

[features]
# Off by default, so no production/release build ever includes it (#39).
# Enabled only by this crate's own dev-dependency below, for
# `tests/panic_recovery.rs` to exercise a real, unconditional handler panic
# through the real router/middleware stack without relying on a bug (like
# the `*:*` sub-clause panic this same change fixes) as its trigger.
test-support = []

[dependencies]
anyhow = "1.0.104"
askama = "0.16.0"
axum = { version = "0.8.9", features = ["json", "multipart"] }
base64 = "0.22.1"
chardetng = "1"
encoding_rs = "0.8"
html5ever = "0.39"
http-body-util = "0.1.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
# `zip`, `quick-xml`, `calamine`, and `rtf-parser` are the office/ODF/RTF
# extractor stack (issue #260). `zip` has default features OFF and only
# `deflate` enabled: office archives are DEFLATE, and disabling every other
# codec (bzip2/zstd/lzma/time-deflate) shrinks the dependency + attack surface
# to exactly what a `.docx`/`.odt` can contain (per the issue's strategy and
# the phase-0 "bounded zip" contract).
zip = { version = "8.6", default-features = false, features = ["deflate"] }
quick-xml = "0.36"
calamine = "0.26"
rtf-parser = "0.3"
sha2 = "0.10.9"
subtle = "2.6.1"
tantivy = "0.26.1"
tempfile = "3.27.0"
# "time" is required by `src/extract.rs`'s `spawn_extraction` timeout. It was
# already enabled transitively (hyper-util, signal); naming it here keeps that
# from becoming a silent dependency on someone else's feature selection.
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
toml = "1.1.3"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6", features = ["catch-panic", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[target.'cfg(any(target_os = "linux", target_vendor = "apple", target_os = "redox"))'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[dev-dependencies]
wayfinder = { path = ".", features = ["test-support"] }
axum = "0.8.9"
http = "1.4.2"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
