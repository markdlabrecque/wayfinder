[package]
name = "wayfinder"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tantivy = "0.26.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net"] }
toml = "1.1.3"

[dev-dependencies]
axum = "0.8.9"
http = "1.4.2"
http-body-util = "0.1.4"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5.3", features = ["util"] }
