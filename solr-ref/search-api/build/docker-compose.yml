# Capture-only stack for issue #55. Deliberately separate container names and
# host ports from the canonical wayfinder-solr-ref / wayfinder-solr-ref-strict
# stack in solr-ref/capture.sh, so it cannot collide with other branches.
services:
  solr:
    image: solr:9
    container_name: wf55-solr
    ports:
      - "8996:8983"
    environment:
      - SOLR_MODULES=analysis-extras
    command: ["solr-precreate", "search_api_capture"]

  mitm:
    image: mitmproxy/mitmproxy:10.3.1
    container_name: wf55-mitm
    depends_on:
      - solr
    ports:
      - "8997:8983"
    volumes:
      - ./mitm-captures:/captures
      - ./capture_addon.py:/capture_addon.py:ro
    command: >
      mitmdump --mode reverse:http://solr:8983 --listen-port 8983
      -s /capture_addon.py --set confdir=/home/mitmproxy/.mitmproxy

  drupal:
    image: drupal:11-php8.3-apache
    container_name: wf55-drupal
    depends_on:
      - mitm
    ports:
      - "8998:80"
    volumes:
      - ./drupal-site:/opt/drupal
